# Suivi d'avancement de Slay the GBA — partie tenue à la main.
#
# Les cartes, reliques, potions, monstres et évènements sont détectés dans le code du moteur par
# scripts/progress.py : inutile de les lister ici. Ce fichier contient ce que le code ne dit pas :
#   - [[category]] : mécaniques, systèmes de jeu, écrans… avec leur statut ;
#   - [overrides.*] : corrections de la détection automatique (élément seulement partiel, hors périmètre…).
#
# Statuts : "oui" (fait), "partiel" (compte pour moitié), "non" (à faire), "exclu" (hors périmètre, non compté).
# `issue` renvoie au ticket GitHub correspondant.
#
# Après modification : `make progress` (régénère AVANCEMENT.md) ou `make site-build` (site + AVANCEMENT.md).

