# Slay the GBA website. Netlify only assembles committed files: pages and ROMs are regenerated
# locally (make roms && make site-build) and committed, since the ROMs need devkitARM.
[build]
  command = "make site-package"
  publish = "dist"

[[headers]]
  for = "/roms/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
