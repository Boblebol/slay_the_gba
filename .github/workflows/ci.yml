# Checks run on every pull request: engine rules, tracker script, ROM build.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # Butano, for the ROM build
      - uses: astral-sh/setup-uv@v5
      - name: Engine tests
        run: make test test-e2e
      # Every scripts/*_test.py: tracker, cartridge memory check, site and art builders, card text widths.
      - name: Script tests
        run: uv run --with pytest --with pillow --with numpy --with markdown --with fonttools --with brotli pytest scripts
      # Fails when avancement.toml is invalid or the detection no longer matches the engine sources.
      - name: Tracker runs
        run: uv run scripts/progress.py
      # The native tests link against libc; the cartridge does not. One ROM is enough to catch what only
      # breaks on the GBA toolchain (missing libc symbols, assets, Butano API).
      - name: ROM builds
        run: make ironclad
      # A cartridge can build and still hang at boot: static data that fills the internal RAM leaves no stack.
      # The built cartridge, to play a pull request in an emulator before merging it (kept 7 days).
      - name: Upload the ROM
        uses: actions/upload-artifact@v4
        with:
          name: slay_ironclad
          path: slay_ironclad.gba
          retention-days: 7
      - name: ROM leaves room for its stack
        run: uv run scripts/check_rom_memory.py ironclad
      # The same cartridge, run without a window: it must draw a screen and react to the buttons. Not blocking
      # yet: the emulator build is new on the CI. Remove continue-on-error once it has been green for a while.
      - name: Headless emulator
        continue-on-error: true
        run: uv run scripts/setup_headless_mgba.py
      - name: Cartridge boots and reads the buttons
        continue-on-error: true
        run: uv run --with pytest --with pillow --with cffi pytest scripts/gba_headless_test.py
