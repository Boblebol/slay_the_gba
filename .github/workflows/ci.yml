# Checks run on every pull request: engine rules, tracker script, ROM build.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # Butano, for the ROM build
      - uses: astral-sh/setup-uv@v5
      - name: Engine tests
        run: make test test-e2e
      - name: Script tests
        run: uv run --with pytest pytest scripts/progress_test.py scripts/check_rom_memory_test.py
      # Fails when avancement.toml is invalid or the detection no longer matches the engine sources.
      - name: Tracker runs
        run: uv run scripts/progress.py
      # The native tests link against libc; the cartridge does not. One ROM is enough to catch what only
      # breaks on the GBA toolchain (missing libc symbols, assets, Butano API).
      - name: ROM builds
        run: make ironclad
      # A cartridge can build and still hang at boot: static data that fills the internal RAM leaves no stack.
      - name: ROM leaves room for its stack
        run: uv run scripts/check_rom_memory.py ironclad
