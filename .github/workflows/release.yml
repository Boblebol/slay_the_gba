# On every push to main: test, then refresh the website and the tracker. When the game itself changed since
# the last tag, build the five ROMs and publish a GitHub release.
#
# The version follows the tracker (scripts/progress.py --next-version): 0.<whole percentage>.<patch> while
# something is left to implement, 1.0.<patch> once everything is done.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "graphics/**"
      - "audio/**"
      - "bible/**"
      - "scripts/**"
      - "site/assets/**"
      - "avancement.toml"
      - "Makefile"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # tags and history, for the version number and the release notes
      - uses: astral-sh/setup-uv@v5

      - name: Tests
        run: |
          make test test-e2e
          uv run --with pytest --with pillow --with numpy --with markdown pytest scripts

      - name: Plan the release
        id: plan
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- src include graphics audio butano Makefile; then
            echo "game_changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(uv run scripts/progress.py --next-version)" >> "$GITHUB_OUTPUT"
          else
            echo "game_changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "last=$last" >> "$GITHUB_OUTPUT"

      - name: Build the five ROMs
        if: steps.plan.outputs.game_changed == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          make roms
          # Never publish a cartridge that hangs at boot for lack of stack room.
          uv run scripts/check_rom_memory.py
          echo "$VERSION" > VERSION

      # Publishes the fresh ROMs in site/roms, regenerates the pages and AVANCEMENT.md.
      - name: Refresh the website and the tracker
        run: make site-build

      # Netlify deploys main: this commit is what puts the new pages and ROMs online.
      - name: Commit the generated files
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site AVANCEMENT.md VERSION bible/livrets_gba
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
          else
            git commit -m "build(site): refresh website${VERSION:+ for v$VERSION}"
            # A run queued behind another one starts from an older main than the previous run's site commit, so
            # both touched the same generated files (the ROMs are binary and cannot be merged). This run was
            # triggered by a newer push, so on a conflict its own generated files win ("theirs" in a rebase).
            # A PR merged between the rebase and the push makes the push fail ("cannot lock ref"): rebase again.
            for attempt in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi

      - name: Publish the GitHub release
        if: steps.plan.outputs.game_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          LAST: ${{ steps.plan.outputs.last }}
        run: |
          {
            uv run scripts/progress.py --release-notes
            echo
            echo "## Changements"
            if [ -n "$LAST" ]; then
              git log --no-merges --pretty='- %s' "$LAST"..HEAD -- . ':!site' ':!AVANCEMENT.md' ':!VERSION'
            else
              echo "- Première version publiée."
            fi
          } > release_notes.md
          prerelease=""
          if [ "${VERSION%%.*}" = "0" ]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" slay_*.gba --title "Slay the GBA v$VERSION" --notes-file release_notes.md \
            --target "$(git rev-parse HEAD)" $prerelease
